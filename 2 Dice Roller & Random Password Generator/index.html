<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller and Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Dice Roller and Password Generator</h1>

    <div class="box">
        <h2>Dice Roller</h2>
        <label for="dice-count">Number of dice:</label>
        <input type="number" id="dice-count" value="1">
        <button id="roll-btn">Roll Dice</button>
        <p id="dice-result"></p>
        <div id="dice-images"></div>
    </div>

    <div class="box">
        <h2>Password Generator</h2>
        <label for="password-length">Password length:</label>
        <input type="number" id="password-length" value="8">
        <div class="options">
            <label><input type="checkbox" id="include-lower"> Lowercase letters</label>
            <label><input type="checkbox" id="include-upper"> Uppercase letters</label>
            <label><input type="checkbox" id="include-numbers"> Numbers</label>
            <label><input type="checkbox" id="include-symbols"> Symbols</label>
        </div>
        <button id="generate-btn">Generate Password</button>
        <p id="password-result"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
