<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-container">
    <h1>To-Do List Tracker</h1>

    <div class="input-section">
      <input type="text" id="js-task-name-input" placeholder="Task name">
      <input type="date" id="js-due-date-input">
      <button id="js-add-button">Add</button>
    </div>

    <div id="js-todo-list-container"></div>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
